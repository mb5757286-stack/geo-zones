name: build-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find the AIoT toolkit npm package
        run: |
          out=probe-result.txt
          : > "$out"
          for p in create-aiot aiot-toolkit aiot @aiot-toolkit/cli @aiot/cli @xiaomi-iot/aiot; do
            echo "== $p" >> "$out"
            npm view "$p" name version description >> "$out" 2>&1 || echo "(not found)" >> "$out"
          done
          cat "$out"
      - name: Commit result
        run: |
          git config user.name "build-probe"
          git config user.email "build-probe@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe result" || true
          git push || true
