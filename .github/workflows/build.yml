name: build-rpk

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install AIoT toolkit
        run: npm install -g aiot-toolkit@2.0.5 2>&1 | tail -20
      - name: Build rpk
        run: |
          mkdir -p dist
          (aiot --help; aiot build) > dist/build-log.txt 2>&1 || echo "build exit code: $?" >> dist/build-log.txt
          cat dist/build-log.txt
          ls -la . dist >> dist/build-log.txt
          find . -name "*.rpk" -not -path "./.git/*" -exec cp {} dist/ \; || true
      - name: Commit build output
        run: |
          git config user.name "build-rpk"
          git config user.email "build-rpk@users.noreply.github.com"
          git add -f dist
          git commit -m "build output" || true
          git push || true
