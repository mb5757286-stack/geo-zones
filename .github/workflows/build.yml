name: build-rpk

on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build rpk
        run: |
          mkdir -p dist
          npx aiot build > dist/build-log.txt 2>&1; echo "exit code: $?" >> dist/build-log.txt
          cat dist/build-log.txt
          find . -name '*.rpk' -not -path './node_modules/*' -exec cp {} dist/ \;
          ls dist/*.rpk
      - name: Commit build output
        if: always()
        run: |
          git config user.name "build-rpk"
          git config user.email "build-rpk@users.noreply.github.com"
          git add -f dist
          git commit -m "build output" || true
          git push
